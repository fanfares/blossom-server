name: Staging security regression checks

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.7.12"
      - run: deno install --frozen
      - run: deno fmt --check
      - run: deno lint
      - run: deno check main.ts
      - run: deno test --allow-net --allow-read --allow-write --allow-env --allow-ffi --allow-sys tests/unit/ tests/e2e/
      - run: deno task build
